<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reportes de Lectura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --ink:#1f2933; --muted:#6b645a; --line:#e7dfd2;
  --brand:#1b5e66; --brand-2:#2c7a73; --brand-soft:#dcebe8; --brand-ink:#ffffff;
  --accent:#c8553d; --accent-soft:#f7e3dd;
  --ok:#2f7d4f; --ok-bg:#e2f1e7; --ok-fill:#3f9a64;
  --late:#9a6212; --late-bg:#fbeed6; --late-fill:#e0a33a;
  --out:#a8372f; --out-bg:#f8e0dc; --out-fill:#cf5a4b;
  --just:#5f4796; --just-bg:#ebe5f6; --just-fill:#8a6fc4;
  --pend:#51606d; --pend-bg:#e8ecf0; --pend-fill:#c3ccd5;
  --none-fill:#eaa79c;
  --warn-bg:#fdf3d7; --warn-ink:#6b4f00;
  --radius:12px; --shadow:0 1px 2px rgba(60,40,20,.05),0 4px 14px rgba(60,40,20,.05);
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141b1c; --panel:#1c2526; --ink:#e9eeec; --muted:#a5b2ae; --line:#2f3c3d;
    --brand:#5fb7ad; --brand-2:#4aa197; --brand-soft:#1f3a39; --brand-ink:#0e1918;
    --accent:#ec8a72; --accent-soft:#3d2620;
    --ok:#8fd8aa; --ok-bg:#1d3527; --ok-fill:#4fae74;
    --late:#f2c36f; --late-bg:#3b2e15; --late-fill:#d39a35;
    --out:#f39b8f; --out-bg:#3e2220; --out-fill:#d9695a;
    --just:#c3b3f3; --just-bg:#2d2744; --just-fill:#9580d1;
    --pend:#bcc7cf; --pend-bg:#2a3338; --pend-fill:#55636c;
    --none-fill:#a95d53;
    --warn-bg:#3a3215; --warn-ink:#f2da8e;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
header{background:linear-gradient(120deg,var(--brand),var(--brand-2));color:var(--brand-ink);padding:16px 16px 14px;border-bottom:4px solid var(--accent)}
header h1{margin:0;font-size:1.2rem;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:.85rem;opacity:.9}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--brand-soft);color:var(--ink)}
nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
h2{font-size:1.08rem;margin:0 0 10px;color:var(--brand)}
h3{font-size:.95rem;margin:14px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
button.btn:hover{filter:brightness(1.08)}
button.btn{font:inherit;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.btn.sec{background:transparent;color:var(--brand)}
button.btn.small{padding:4px 8px;font-size:.82rem}
button.btn.danger{border-color:var(--out);background:transparent;color:var(--out)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{border:1px solid var(--line);border-left:5px solid var(--k,var(--brand));border-radius:var(--radius);padding:10px 12px;background:var(--panel)}
.kpi b{display:block;font-size:1.6rem;color:var(--k,var(--brand))}
.kpi span{font-size:.8rem;color:var(--muted)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.e-a_tiempo{background:var(--ok-bg);color:var(--ok)}
.e-extemporaneo{background:var(--late-bg);color:var(--late)}
.e-fuera_plazo{background:var(--out-bg);color:var(--out)}
.e-no_entregado{background:var(--out-fill);color:#fff}
.s-ambos{background:var(--ok-bg);color:var(--ok)}
.s-solo_reporte{background:var(--late-bg);color:var(--late)}
.s-solo_libro{background:var(--just-bg);color:var(--just)}
.s-ninguno{background:var(--out-bg);color:var(--out)}
.e-pendiente{background:var(--pend-bg);color:var(--pend)}
.e-no_aplica{background:var(--line);color:var(--muted)}
.e-prorroga,.e-justificado{background:var(--just-bg);color:var(--just)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.tablewrap{overflow-x:auto}
.muted{color:var(--muted)}
.note{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:.87rem;margin:8px 0}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:.87rem;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex-direction:row;align-items:center;gap:0;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{padding:5px 9px;font-size:.8rem;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--brand);color:var(--brand-ink)}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:-2px}
.secrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.dim{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.dim details{margin-top:6px;font-size:.84rem}
.dim ol{margin:4px 0;padding-left:20px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 14px}
.checks label{flex-direction:row;align-items:flex-start;gap:6px;color:var(--ink);font-size:.86rem}
.bar{display:flex;height:24px;border-radius:7px;overflow:hidden;background:var(--pend-bg);gap:2px}
.bar div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;margin:6px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.hidden{display:none!important}
.lock{max-width:440px;margin:24px auto}
.lock input{width:100%}
.sync{display:inline-block;margin-top:6px;font-size:.78rem;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.18)}
.sync.ok{background:rgba(255,255,255,.28)} .sync.err{background:var(--accent);color:#fff}
.cover{width:44px;height:58px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--pend-bg);display:block}
.cover.lg{width:120px;height:160px}
.libro{display:flex;gap:8px;align-items:center;min-width:220px}
.libro small{display:block;color:var(--muted);font-size:.76rem}
.perfil{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
@media (max-width:600px){.perfil{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.tag{background:var(--brand-soft);border-radius:999px;padding:2px 10px;font-size:.8rem}
.ruta{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.ruta figure{margin:0;width:72px;flex:0 0 auto;text-align:center;font-size:.7rem;color:var(--muted)}
.ruta figure.actual img{outline:3px solid var(--accent);outline-offset:1px}
.ruta img{width:66px;height:88px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.ind{display:block;color:var(--muted);font-size:.8rem}
.exportbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);font-size:.86rem}
.exportsep{width:1px;align-self:stretch;background:var(--line);margin:0 6px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.btnfoto{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:7px 12px;font-size:.9rem;font-weight:600}
.btnfoto:hover{filter:brightness(1.08)}
.secctl{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:60%}
.evid{white-space:nowrap}
.evid.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.evidtxt{max-width:520px;text-align:right}
.evidfila{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:6px}
.evidfila .evidtxt{text-align:left}
.miniaturas{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.soltar{border:2px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;margin-top:10px}
.soltar.activa{border-color:var(--brand);background:var(--brand-soft)}
.bandeja{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px}
.bandeja figure{margin:0;border:1px solid var(--line);border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:6px}
.bandeja figure>img{width:100%;height:220px;object-fit:contain;background:var(--pend-bg);border-radius:6px;cursor:zoom-in}
.bandeja .libro img{width:48px;height:auto;max-height:70px}
.bandeja .libro{display:flex;gap:8px;align-items:center}
.bandeja select,.bandeja input[type=date]{width:100%}
.miniaturas figure{margin:0;width:120px;flex:0 0 auto;font-size:.74rem}
.mini{padding:0;border:1px solid var(--line);border-radius:6px;background:var(--pend-bg);cursor:pointer;width:120px;height:120px;overflow:hidden;display:block}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
dialog#visor{width:min(1200px,96vw);max-height:94vh;padding:0;border:0;border-radius:var(--radius);background:var(--panel);color:var(--ink)}
dialog#visor::backdrop{background:rgba(0,0,0,.55)}
.visor .vhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vtitulo{font-weight:700;color:var(--brand)}
.vcuerpo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px;max-height:calc(94vh - 80px);overflow:auto}
@media (max-width:800px){.vcuerpo{grid-template-columns:1fr}}
.vfoto{position:relative;align-self:start;line-height:0;touch-action:none;user-select:none}
.vfoto img{width:100%;height:auto;display:block;border-radius:6px}
.vfoto.dibujando{cursor:crosshair;outline:3px dashed var(--accent);outline-offset:2px}
.zona{position:absolute;border:3px solid var(--accent);border-radius:3px;box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}
.zona span{position:absolute;top:-22px;left:-3px;background:var(--accent);color:#fff;font:700 12px/20px var(--font);padding:0 6px;border-radius:3px}
.zona.otra{box-shadow:none;border:2px dashed rgba(255,255,255,.9);outline:1px solid rgba(0,0,0,.4);background:transparent;pointer-events:auto;cursor:pointer;padding:0}
.zona.otra span{background:#1f2933;font-size:11px;line-height:18px;top:-19px}
.vpanel label{width:100%}
.vpanel textarea{width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.87rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
@media (max-width:600px){main{padding:12px}section.card{padding:12px}}
@media print{nav,header,.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<header>
  <h1>Control de Reportes de Lectura</h1>
  <p>Biblioteca Viva · Ciclo 2026-2027 · Uso interno del docente</p>
  <span id="sync" class="sync" role="status">Guardado solo en este equipo</span> <span class="sync" title="Versión de la aplicación">Versión 8.1 · rutas del 10/11/2026 y ronda 3 de elección libre</span>
</header>
<nav id="nav" aria-label="Secciones">
  <button data-view="panel" aria-current="page">Panel</button>
  <button data-view="grupos">Entregas por grupo</button>
  <button data-view="fotos">Recibir fotos</button>
  <button data-view="registrar">Revisar reporte</button>
  <button data-view="criterios">Criterios</button>
  <button data-view="datos">Exportar y respaldos</button>
  <button data-view="config">Rondas y lista</button>
</nav>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   CONFIGURACIÓN PEDAGÓGICA
   Apartados por grado. Ronda 1: «Formatos_Reporte_de_Lectura_Cuaderno_1-6»; con ellos se valoraron
   los reportes hechos con el formato de grado (3A-08, 3A-10, 6A-17). Ronda 2 en adelante: guías nuevas,
   con el mismo número de apartados por grado. El apartado 0 es el encabezado que todos copian.
   ============================================================ */
const GRUPOS = ["1°A","2°A","3°A","4°A","5°A","6°A"];
const SECCIONES_R1 = {
  1:["Encabezado (n.º y fecha)","Título del cuento","Mi dibujo","¿Qué pasó?","¿Me gustó? (carita)"],
  2:["Encabezado (n.º y fecha)","Título y autor","Personajes","Al principio…","Al final…","Mi dibujo","¿Me gustó? ¿Por qué?"],
  3:["Encabezado (n.º y fecha)","Título y autor","Personajes principales","¿Dónde y cuándo pasa?","¿Qué pasó?","Una pista y lo que descubrí","Una palabra nueva","Mi opinión"],
  4:["Encabezado (n.º y fecha)","Título y autor","Personajes principales","¿Dónde y cuándo pasa?","Resumen","¿Por qué el personaje actuó así?","Una palabra nueva","Mi opinión"],
  5:["Encabezado (n.º y fecha)","Ficha del libro","Resumen en mis propias palabras","¿Qué mueve a los personajes?","¿Qué mensaje quiso dejar el autor?","Mi opinión con una razón","Lo conecto con mi vida o con el mundo"],
  6:["Encabezado (n.º y fecha)","Ficha del libro","Resumen en mis propias palabras","Análisis de un personaje","Lo que el texto no dice pero yo deduzco","Mi postura, con argumentos","¿Se parece a otro libro que he leído?","¿A quién se lo recomendaría y por qué?"]
};
const SECCIONES = {
  1:["Encabezado (n.º y fecha)","Título del libro","Mi dibujo","¿Qué pasó? o ¿Qué aprendí?","Mi semáforo y lo que más me gustó"],
  2:["Encabezado (n.º y fecha)","Título y autor","Personajes o tema","Al principio…","Al final…","Mi dibujo","Me gustó porque…"],
  3:["Encabezado (n.º y fecha)","Título y autor","Personajes o tema","¿Dónde y cuándo? o Tres cosas que aprendí","¿Qué pasó? o Mi página favorita","Una pista y lo que descubrí","Una palabra nueva","Mi opinión"],
  4:["Encabezado (n.º y fecha)","Título y autor","Personajes o tema","¿Dónde y cuándo? o Tres cosas que aprendí","Resumen","Lo que deduzco, con su pista","Una palabra nueva","Mi opinión"],
  5:["Encabezado (n.º y fecha)","Ficha del libro","Resumen o ideas principales","Lo que deduzco, con su pista","¿Qué quiso decirnos el autor?","Mi opinión y a quién se lo recomiendo","Lo conecto con mi vida o con el mundo"],
  6:["Encabezado (n.º y fecha)","Ficha del libro","Resumen o ideas principales","Un personaje o un tema a fondo","Lo que el texto no dice, pero yo deduzco","Mi postura, con argumentos","¿Se parece a otro libro que he leído?","¿A quién se lo recomendaría y por qué?"]
};
const banda = g => g<=2 ? "A" : g<=4 ? "B" : "C";
const NIVELES = ["Inicio","En camino","Logrado","Va más allá"];
const DIMENSIONES = [
  {id:"D1", nombre:"Recupera lo que dice el libro", pregunta:"¿El reporte muestra datos que sí están en el libro?",
   d:{A:["Escribe o dicta el título con ayuda; lo que menciona no se relaciona con claridad con el cuento.","Título correcto y uno o dos elementos del cuento (un personaje, un objeto).","Título (y autor en 2.°) correctos; personajes o hechos que sí están en el cuento.","Agrega detalles precisos (nombres, lugares, objetos) que muestran que volvió al libro."],
      B:["Datos de portada incompletos; personajes o lugar que no corresponden al libro.","Título y autor correctos; nombra personajes sin decir quiénes son.","Personajes con una frase de quién es cada uno, y lugar y tiempo (o «el libro no lo dice»).","Además distingue personajes principales de secundarios o precisa detalles de lugar y tiempo."],
      C:["Ficha incompleta: falta título o autor.","Título y autor; faltan editorial o género (en 6.°, también páginas).","Ficha completa según lo que pide su grado.","Ficha completa y explica por qué el libro pertenece a ese género."]}},
  {id:"D2", nombre:"Lo cuenta con sus palabras", pregunta:"¿Reconstruye la historia en orden y sin copiar?",
   d:{A:["Un dibujo o una frase suelta, sin relación con la secuencia.","Una idea de lo que pasó.","En 1.°: lo que pasó, en orden (puede ser dictado). En 2.°: una oración de inicio y una de final.","Une las partes con «después», «entonces» o nombra el problema del cuento."],
      B:["Copia frases del libro o lista hechos sueltos.","Inicio y final; falta lo que pasó en medio.","Inicio, desarrollo y final con sus palabras.","Además identifica el problema central y cómo se resuelve."],
      C:["Texto copiado del libro o de otra fuente.","Resumen parcial o centrado en detalles secundarios.","Historia completa con sus palabras y con las ideas principales.","Síntesis que elige lo esencial y lo dice en pocas líneas."]}},
  {id:"D3", nombre:"Lee entre líneas y muestra la pista", pregunta:"¿Deduce algo que el libro no dice y señala la página que lo sostiene?",
   d:{A:null,
      B:["Repite algo que el libro dice tal cual; todavía no aparece una deducción.","Hace una deducción, pero sin pista o sin página.","Deducción con la pista y la página que la sostienen.","Usa más de una pista o explica cómo las unió."],
      C:["Confunde la deducción con el resumen.","Deducción posible, sin evidencia del texto.","Deducción con pista y página.","Relaciona motivos, cambios del personaje o mensaje del autor con varias pistas."]}},
  {id:"D4", nombre:"Opina y da razones", pregunta:"¿Toma una postura y la sostiene?",
   d:{A:["No marca opinión.","Marca una carita o dice sí o no.","En 1.°: carita y dibujo de lo que más le gustó. En 2.°: «Me gustó porque…» con una razón.","La razón se liga a una parte concreta del cuento."],
      B:["Opinión sin razón.","Razón general («porque está bonito»).","Razón ligada a algo que pasa en el libro.","Dos razones, o compara con otro libro o con algo que vivió."],
      C:["Postura sin argumento.","Un argumento general.","Postura con argumentos ligados a la historia (en 6.°, al menos dos).","Considera otra postura posible o recomienda el libro a un lector concreto, con razones."]}},
  {id:"D5", nombre:"Lo hace suyo", pregunta:"¿Qué decisiones propias tomó para comunicar lo que entendió?",
   d:{A:null,B:null,C:null},
   comun:["Sigue el formato sin marcas propias.","Toma alguna decisión propia (dibujo, color, orden).","Sus decisiones ayudan a entender: dibujo que explica, esquema, conexión con su vida o sus intereses.","Propuesta original (cómic, carta al personaje, mapa) que conserva lo que pide cada apartado."]}
];
const PERSONALIZACION = [
  "Dibujo o ilustración propia que explica algo del libro",
  "Esquema, mapa u organizador gráfico",
  "Conexión con un interés propio (juego, serie, deporte, música)",
  "Conexión con su vida, su familia o su comunidad",
  "Formato distinto (cómic, carta, entrevista, mapa)",
  "Usa palabras o citas del libro en su lugar",
  "Va más allá de lo que pide el formato",
  "Se nota acompañamiento de la familia (declarado o visible)"
];
const PRODUCCION = {autonomo:"Lo escribió el alumno", dictado:"Lo dictó a un adulto", mixto:"Mixto (escribió y dictó)", oral:"Lo contó en voz alta y el docente registró"};
const SIGUIENTE = [
  "Modelar en voz alta cómo buscar la página que sostiene una pista",
  "Practicar inicio-desarrollo-final con tres dibujos o tres tarjetas",
  "Ofrecer marco de oración para opinar («Me gustó porque… / Lo sé porque en la página…»)",
  "Recomendar un libro de su ruta ligado a un interés del Semáforo",
  "Leer juntos un fragmento y releer para recuperar datos",
  "Conversar con la familia sobre el momento de lectura en casa",
  "Revisar con especialista (USAER/UDEII) si la misma necesidad se repite en varias rondas",
  "Reconocer públicamente una decisión propia del reporte"

async function derivar(pw, sal, extraible, usos){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(sal), iterations:ROSTER_CIFRADO.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, extraible, usos);
}
async function desbloquear(ev){
  ev.preventDefault();

  if(!crypto?.subtle){ msg.textContent = "Este navegador no permite abrir listas cifradas. Use Chrome, Edge o Firefox actualizados."; return; }
  msg.textContent = "Abriendo listas…";
  let datos;
  try{
    const key = await derivar(pw, ROSTER_CIFRADO.salt, false, ["decrypt"]);
    const plano = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ROSTER_CIFRADO.iv)}, key, b64(ROSTER_CIFRADO.ct));
    datos = JSON.parse(new TextDecoder().decode(plano));
  }catch(e){ msg.textContent = "Contraseña incorrecta. Revise mayúsculas y puntos. Si la contraseña se cambió hace poco, espere dos minutos y recargue con Ctrl + Shift + R."; return; }

const RONDAS_INICIALES = [

const RUTAS_VERSION = 9;
function estadoVacio(){ return {version:2, calendario:CALENDARIO, roster:[], perfiles:null, rondas:structuredClone(RONDAS_INICIALES), registros:[], borrados:[], fotosMeta:{}, ultimoRespaldo:null}; }
let S;
function cargar(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : estadoVacio(); }
  catch(e){ S = estadoVacio(); aviso("No se pudo leer el almacenamiento del navegador; se inicia vacío."); }
  if(!S.rondas || !S.rondas.length) S.rondas = structuredClone(RONDAS_INICIALES);
  const r1 = S.rondas.find(r=>r.id==="R1"); if(r1 && r1.extemporaneoUnico===undefined) r1.extemporaneoUnico = true;
  RONDAS_INICIALES.forEach(r=>{ if(!S.rondas.some(x=>x.id===r.id || x.nombre===r.nombre)) S.rondas.push(structuredClone(r)); });
  /* Un navegador con un calendario anterior recibe las fechas nuevas de las rondas 2 a 6 una sola vez. */
  if((S.calendario||1) < CALENDARIO){
    RONDAS_INICIALES.filter(r=>r.id!=="R1").forEach(r=>{ const x = S.rondas.find(y=>y.id===r.id); if(x) Object.assign(x, {inicio:r.inicio, limite:r.limite, extemporaneo:r.extemporaneo, extemporaneoUnico:false}); });
    S.calendario = CALENDARIO; guardarLocal();
  }
  S.rondas.sort((a,b)=>a.limite.localeCompare(b.limite));
  if(!S.borrados) S.borrados = [];
  if(S.perfiles && (S.rutasVersion||1) < RUTAS_VERSION){ S.perfiles = null; guardarLocal(); }
  if(S.perfiles) autocompletarLibros();
}

}

  const g = perfilDe(alumnoId)?.guia;
  if(g && g.ronda===ronda.id && g.entrega && g.entrega!==ronda.limite) return {limite:g.entrega, extemporaneo:g.entrega, propia:true, origen:"guia"};
  return {limite:ronda.limite, extemporaneo:ronda.extemporaneo, propia:false};
}
/* Estado de entrega: manda la fecha de recepción. El estado especial solo aplica mientras no se reciba. */
function estadoEntrega(alumnoId, ronda){
  if(rondaSinReporte(alumnoId, ronda.id)) return "no_aplica";
  const r = registroDe(alumnoId, ronda.id); const L = limitesDe(alumnoId, ronda);
  if(r && r.fechaRecepcion){
    if(r.fechaRecepcion <= L.limite) return "a_tiempo";
    if(r.fechaRecepcion <= L.extemporaneo) return "extemporaneo";
    return "fuera_plazo";
  }
  if(r && r.estadoManual) return r.estadoManual;
  return hoy() <= L.extemporaneo ? "pendiente" : "no_entregado";
}
const porRecibir = (a, ronda) => { const e = estadoEntrega(a.id, ronda); return e==="pendiente" || e==="no_entregado" || e==="prorroga"; };
/* El libro se registra aparte del reporte: «libroDevuelto» guarda la fecha en que regresó el libro de la ronda.
   Cruzar ambas entregas da cuatro situaciones (la ronda que no aplica no entra en ninguna). */
const SITUACIONES = {ambos:"Entregó reporte y libro", solo_reporte:"Entregó reporte · libro pendiente", solo_libro:"Entregó libro · sin reporte", ninguno:"Sin reporte ni libro"};
const ordenLista = (a,b) => GRUPOS.indexOf(a.grupo)-GRUPOS.indexOf(b.grupo) || a.nl-b.nl;
function situacionEntrega(alumnoId, ronda){
  const e = estadoEntrega(alumnoId, ronda); if(e==="no_aplica") return "";
  const reporte = e==="a_tiempo" || e==="extemporaneo" || e==="fuera_plazo";
  const libro = !!registroDe(alumnoId, ronda.id)?.libroDevuelto;
  return reporte ? (libro ? "ambos" : "solo_reporte") : (libro ? "solo_libro" : "ninguno");
}
function alumnosSituacion(ronda, sit, grupo){
  return S.roster.filter(a=>(!grupo || a.grupo===grupo) && (sit==="todas" ? situacionEntrega(a.id,ronda) : situacionEntrega(a.id,ronda)===sit)).sort(ordenLista);
}
function conteoSituacion(ronda, grupo){
  const c = Object.fromEntries(Object.keys(SITUACIONES).map(k=>[k,0]));
  S.roster.filter(a=>!grupo || a.grupo===grupo).forEach(a=>{ const s = situacionEntrega(a.id, ronda); if(s) c[s]++; });
  return c;
}
/* Apartados que se revisan: los de la guía personalizada si existe para esa ronda; si no, los del formato del grado. */
function seccionesDe(alumnoId, rondaId){
  const g = perfilDe(alumnoId)?.guia;
  const usaGrado = registroDe(alumnoId, rondaId)?.formato==="grado";
  if(!usaGrado && g && g.ronda===rondaId && g.apartados?.length) return [{titulo:"Encabezado (n.º y fecha)",indicacion:""}, ...g.apartados];
  return (rondaId==="R1" ? SECCIONES_R1 : SECCIONES)[gradoDe(alumnoPorId(alumnoId)?.grupo||"1")].map(t=>({titulo:t,indicacion:""}));
}
function completitud(reg){
  const n = seccionesDe(reg.alumnoId, reg.ronda).length; let suma=0, marcadas=0;
  for(let i=0;i<n;i++){ const v = reg.secciones?.[i]; if(v!==undefined && v!==null){ suma+=v; marcadas++; } }
  return marcadas ? Math.round(100*suma/(2*marcadas)) : null;
}
/* Llena el libro (de la ruta) y el n.º de reporte en los registros que aún no los tienen. */
function autocompletarLibros(){
  S.registros.forEach(r=>{
    const f = folioDe(r.alumnoId, r.ronda); if(!f) return;
    r.libro = r.libro || {};
    if(!r.libro.folio && !r.libro.titulo){ const L = LIBROS[f]||{}; Object.assign(r.libro,{folio:f, titulo:L.t||"", autor:L.a||"", deRuta:"si"}); }
    if(!r.numReporte) r.numReporte = numReporteDe(r.alumnoId, r.ronda);
  });
}
const portada = (folio, cls="cover") => folio ? `<img class="${cls}" src="portadas/${esc(folio)}.jpg" alt="Portada de ${esc(LIBROS[folio]?.t||folio)}" loading="lazy" onerror="this.style.visibility='hidden'">` : "";
function dimAplica(dim, grado){ return dim.comun ? true : !!dim.d[banda(grado)]; }
function descriptores(dim, grado){ return dim.comun || dim.d[banda(grado)]; }
function revisado(reg){ return reg && (reg.secciones && Object.keys(reg.secciones).length || reg.dimensiones && Object.values(reg.dimensiones).some(v=>v)); }

      <td><input type="date" class="f-libro" value="${r?.libroDevuelto||""}" aria-label="Fecha en que devolvió el libro ${esc(a.nombre)}" onchange="fijarLibro('${a.id}',this.value)"> <button class="btn small sec noprint" onclick="fijarLibro('${a.id}',hoy())">Libro hoy</button><br><span class="chip s-${situacionEntrega(a.id,ronda)}" id="sit-${a.id}">${SITUACIONES[situacionEntrega(a.id,ronda)]}</span></td>
      <td class="noprint"><div class="row" style="gap:4px">
        <button class="btn small" onclick="fijarFecha('${a.id}',hoy())">Recibido hoy</button>
        <select aria-label="Estado especial" onchange="fijarManual('${a.id}',this.value)">
          <option value="">Estado especial…</option>
          <option value="prorroga" ${r?.estadoManual==="prorroga"?"selected":""}>Prórroga acordada</option>
          <option value="justificado" ${r?.estadoManual==="justificado"?"selected":""}>Justificado</option>
          <option value="__quitar">Quitar estado especial</option>
        </select>
        <button class="btn small sec" onclick="abrirRevision('${a.id}')">Revisar</button>
        ${r?`<button class="btn small danger" onclick="borrarRegistro('${a.id}')" title="Borrar registro de esta ronda">×</button>`:""}
      </div></td></tr>`; }).join("")
  }</tbody></table></div></section>${recordatorioRespaldo()}`;
}
function obtenerRegistro(alumnoId, rondaId, crear=true){
  let r = registroDe(alumnoId, rondaId);
  if(!r && crear){
    r = {...obtenerRegistroVacio(alumnoId, rondaId), id:uid()};
    const f = folioDe(alumnoId, rondaId);
    if(f){ const L = LIBROS[f]||{}; r.libro = {folio:f, titulo:L.t||"", autor:L.a||"", deRuta:"si"}; r.numReporte = numReporteDe(alumnoId, rondaId); }
    S.registros.push(r);
  }
  return r;
}
function tocar(r){ r.actualizado = new Date().toISOString(); guardar(); }
/* En la tabla de grupo se actualiza solo la fila: así un clic en la fila siguiente
   no se pierde cuando el cambio de fecha se confirma al salir del campo. */
function refrescarFila(alumnoId){
  const chip = document.getElementById("chip-"+alumnoId);
  if(vista!=="grupos" || !chip) return render();
  const e = estadoEntrega(alumnoId, rondaSel());
  chip.className = "chip e-"+e; chip.textContent = ESTADOS[e];
  const fila = chip.closest("tr"); const r = registroDe(alumnoId, rondaSel().id);
  fila.querySelector(".f-reporte").value = r?.fechaRecepcion || "";
  fila.querySelector(".f-libro").value = r?.libroDevuelto || "";
  const s = situacionEntrega(alumnoId, rondaSel()); const sit = document.getElementById("sit-"+alumnoId);
  sit.className = "chip s-"+s; sit.textContent = SITUACIONES[s];
  const sel = fila.querySelector("select"); if(sel) sel.value = r?.estadoManual || "";
}
function fijarFecha(alumnoId, fecha){
  const r = obtenerRegistro(alumnoId, rondaSel().id); r.fechaRecepcion = fecha; tocar(r); refrescarFila(alumnoId);
  const a = alumnoPorId(alumnoId);
  const e = estadoEntrega(alumnoId,rondaSel());
  if(fecha) aviso(`${a.grupo} n.º ${a.nl}: ${ESTADOS[e]}${e==="extemporaneo"?(rondaSel().extemporaneoUnico?" · se acepta solo por esta ocasión":" · dentro de la semana de prórroga"):""}`);
}
function fijarLibro(alumnoId, fecha){
  const r = obtenerRegistro(alumnoId, rondaSel().id); r.libroDevuelto = fecha; tocar(r); refrescarFila(alumnoId);
  const a = alumnoPorId(alumnoId);
  aviso(`${a.grupo} n.º ${a.nl}: ${SITUACIONES[situacionEntrega(alumnoId, rondaSel())]}`);
}
function fijarManual(alumnoId, v){
  if(!v) return; const r = obtenerRegistro(alumnoId, rondaSel().id);
  r.estadoManual = v==="__quitar" ? "" : v; tocar(r); refrescarFila(alumnoId);
}
function borrarRegistro(alumnoId){
  const a=alumnoPorId(alumnoId);
  if(!confirm(`¿Borrar el registro de ${a.nombre} en ${rondaSel().nombre}? Se pierden fecha y revisión.`)) return;
  quitarRegistro(alumnoId, rondaSel().id); guardar(); render();
}
/* Quita el registro y deja la marca de borrado para que la sincronización con GitHub no lo traiga de vuelta. */
function quitarRegistro(alumnoId, rondaId){
  S.registros = S.registros.filter(r=>!(r.alumnoId===alumnoId && r.ronda===rondaId));
  S.borrados.push({clave:alumnoId+"|"+rondaId, fecha:new Date().toISOString()});
}
function abrirRevision(alumnoId){ edicion={alumnoId}; ir("registrar"); }

function seg(nombre, opciones, valor, onchange){
  return `<span class="seg" role="radiogroup">${opciones.map(([v,t])=>`<label><input type="radio" name="${nombre}" value="${v}" ${String(valor)===String(v)?"checked":""} onchange="${onchange}"><span>${t}</span></label>`).join("")}</span>`;
}

function regActual(){ return obtenerRegistro(edicion.alumnoId, rondaSel().id); }
function campo(k,v){ const r=regActual(); r[k]=v; tocar(r); if(["fechaRecepcion","produccion","limitePropio","formato"].includes(k)) render(); }
function campoLibro(k,v){
  const r=regActual(); r.libro = r.libro||{};
  if(k==="folio"){ v = v.trim().toUpperCase().replace(/^BV-?(\d{1,4})$/, (m,d)=>"BV-"+d.padStart(4,"0")).replace(/^(\d{1,4})$/, (m,d)=>"BV-"+d.padStart(4,"0")); }
  r.libro[k]=v;
  if(k==="folio" && LIBROS[v]){ r.libro.titulo = LIBROS[v].t; r.libro.autor = LIBROS[v].a; if(!r.libro.deRuta) r.libro.deRuta = folioDe(r.alumnoId, r.ronda)===v && !RONDAS_LIBRES[r.ronda] ? "si" : "no"; tocar(r); render(); return; }
  tocar(r);
}
function seccion(i,v){ const r=regActual(); r.secciones=r.secciones||{}; r.secciones[i]=Number(v); tocar(r); render(); }
function dimension(id,v){ const r=regActual(); r.dimensiones=r.dimensiones||{}; if(v) r.dimensiones[id]=Number(v); else delete r.dimensiones[id]; tocar(r); render(); }
function lista(k,i,on){ const r=regActual(); const a=new Set(r[k]||[]); on?a.add(i):a.delete(i); r[k]=[...a].sort((x,y)=>x-y); tocar(r); }
function revisarObs(t){ const w=$("#obsWarn"); if(w) w.classList.toggle("hidden", !DISPOSICIONAL.test(t)); }

function vistaCriterios(){
  const tabla = g => `<div class="tablewrap"><table><thead><tr><th>Dimensión</th>${NIVELES.map((n,i)=>`<th>${i+1} · ${n}</th>`).join("")}</tr></thead><tbody>${
    DIMENSIONES.map(d=>{ const desc = d.comun || d.d[g]; return desc ? `<tr><td><b>${d.id} · ${esc(d.nombre)}</b><br><span class="muted">${esc(d.pregunta)}</span></td>${desc.map(t=>`<td>${esc(t)}</td>`).join("")}</tr>` : `<tr><td><b>${d.id} · ${esc(d.nombre)}</b></td><td colspan="4" class="muted">No aplica: el formato de estos grados todavía no pide este paso.</td></tr>`; }).join("")
  }</tbody></table></div>`;
  return `<section class="card"><h2>Por qué estos criterios</h2>
  <p>Cada alumno arma su reporte a su manera: pega las tiras donde termina, dibuja, dicta o copia encabezados. Por eso conviene separar tres preguntas que suelen mezclarse en una sola calificación:</p>
  <ol>
    <li><b>¿Lo entregó y cuándo?</b> Es el control de entregas. Se calcula solo con la fecha de recepción y las fechas de la ronda, para que nadie dependa de la memoria del docente.</li>
    <li><b>¿Están los apartados que pide su guía?</b> Es la completitud. En la Ronda 1 usa los apartados de la guía personalizada de cada alumno; en las demás rondas, los del formato de cuaderno de su grado.</li>
    <li><b>¿Qué tan bien muestra que entendió el libro?</b> Son las cinco dimensiones. Siguen la misma escalera que ya pide el formato: primero recuperar lo que dice el texto, luego contarlo con sus palabras, después leer entre líneas con una pista, y opinar con razones.</li>
  </ol>
  <p>La quinta dimensión, <b>Lo hace suyo</b>, existe porque los reportes son personales. Un dibujo que explica, una conexión con el videojuego que más le gusta o una carta al personaje son decisiones que dicen mucho de cómo se está apropiando de la lectura. Se registran como casillas para poder contarlas y graficarlas sin nombres.</p>
  <p>La forma de producción (escrito, dictado, mixto, oral) se anota y no resta. En 1.° y 2.° el formato permite dictar; en cualquier grado, un alumno que dicta sigue mostrando comprensión. Anotarlo evita leer mal los datos después.</p>
  <p>«Sin evidencia» es distinto de «Inicio». Si el reporte no trae el apartado de la pista, la dimensión D3 queda sin evidencia: lo que falta se ve en completitud y no se convierte en un nivel bajo. Si la guía del alumno no pedía ese paso, D3 no se lee como carencia del alumno sino de la guía.</p>
  <p>Una página que no se fotografió queda «Sin marcar» y no cuenta en la completitud: el porcentaje se calcula solo con lo revisado y la ficha indica cuántos apartados faltan por revisar en el cuaderno.</p>
  <p>Cada reporte puede valorarse con la guía personalizada o con el formato de cuaderno de su grado, según lo que el alumno haya usado.</p>
  <p>Una lámina impresa, descargada o hecha por un adulto no cuenta como decisión propia en D5; sí se registra como acompañamiento de la familia. La forma de producción se deja en «Sin dato» hasta verla: la letra de un adulto se anota como dictado o mixto y no resta.</p>
  <p>Los niveles describen el reporte de una ronda. Al comparar rondas se ve el avance, y cuando una misma necesidad se repite, el siguiente paso propone conversar con la familia o revisar con el equipo especialista: casa, escuela y especialistas mirando el mismo dato.</p>
  </section>
  <section class="card"><h2>Estados de entrega</h2><table><tbody>
   <tr><td><span class="chip e-a_tiempo">A tiempo</span></td><td>Recibido hasta la fecha límite de la ronda.</td></tr>
   <tr><td><span class="chip e-extemporaneo">Extemporáneo</span></td><td>Recibido después de la fecha límite y hasta el cierre de la prórroga. En la Ronda 1 fue por única ocasión (lunes 12/10/2026); desde la Ronda 2 todos tienen una semana de prórroga después de la fecha límite.</td></tr>
   <tr><td><span class="chip e-fuera_plazo">Fuera de plazo</span></td><td>Recibido después del cierre de la prórroga. Se registra igual: el reporte cuenta para la lectura aunque no para el plazo.</td></tr>
   <tr><td><span class="chip e-prorroga">Prórroga acordada</span></td><td>Hubo un acuerdo previo con la familia o con el equipo especialista. Al registrar la fecha de recepción, el estado pasa a calcularse con esa fecha.</td></tr>
   <tr><td><span class="chip e-justificado">Justificado</span></td><td>Ausencia o situación justificada.</td></tr>
   <tr><td><span class="chip e-pendiente">Pendiente</span></td><td>Sin recibir, y la ronda sigue abierta.</td></tr>
   <tr><td><span class="chip e-no_entregado">No entregado</span></td><td>Sin recibir, y ya pasó el día de extemporáneos.</td></tr>

function combinar(registros, rondas){

  registros.forEach(n=>{
    if(!alumnoPorId(n.alumnoId) || !rondaPorId(n.ronda)){ omitidos.push(n.alumnoId); return; }
    const r=registroDe(n.alumnoId,n.ronda);
    if(!r){ S.registros.push({...obtenerRegistroVacio(n.alumnoId,n.ronda),...n,id:uid()}); nuevos++; }
    else if(!r.actualizado || (n.actualizado||"") >= r.actualizado){ Object.assign(r,{...n,id:r.id}); act++; }
  });
  autocompletarLibros(); guardar(); render();
  aviso(`${nuevos} nuevos, ${act} actualizados${omitidos.length?`, ${omitidos.length} omitidos (alumno o ronda no encontrados)`:""}`);

/* ============================================================
   GUARDADO AUTOMÁTICO EN GITHUB
   Rondas y registros se guardan cifrados (AES-GCM, clave derivada de la misma
   contraseña) en un archivo del repositorio, dentro de una rama aparte («datos»)
   para que la página no se reconstruya en cada guardado. Cada cambio se sube a
   los pocos segundos; al abrir la página en otro equipo se descarga y se combina
   registro por registro (gana la versión modificada más recientemente).
   ============================================================ */
const GH_KEY = "reportes_lectura_github_v1", CLAVE_KEY = "reportes_lectura_clave_v1";
const GH_RUTA = "datos/reportes_lectura.cifrado.json";
let gh = (()=>{ try{ return JSON.parse(localStorage.getItem(GH_KEY)||"null"); }catch(e){ return null; } })();
let claveDatos = null, syncEnCurso = false, syncPendiente = false, syncTimer = null, ramaLista = false;
let estadoSync = {tipo:"", texto:""};
const syncActiva = () => !!(gh && claveDatos && estadoSync.tipo==="ok");
async function guardarClaveDatos(pw){
  const k = await derivar(pw, DATOS_SAL, true, ["encrypt","decrypt"]);
  const raw = new Uint8Array(await crypto.subtle.exportKey("raw", k));
  try{ localStorage.setItem(CLAVE_KEY, aB64(raw)); }catch(e){}
  claveDatos = k;
}
async function cargarClaveDatos(){
  const raw = localStorage.getItem(CLAVE_KEY); if(!raw) return;
  try{ claveDatos = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["encrypt","decrypt"]); }catch(e){ claveDatos = null; }
}
const aB64 = u8 => { let t=""; for(let i=0;i<u8.length;i+=32768) t+=String.fromCharCode(...u8.subarray(i,i+32768)); return btoa(t); };
async function cifrarDatos(obj){

  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, claveDatos, new TextEncoder().encode(JSON.stringify(obj))));
  return {aplicacion:"Reportes de Lectura · Biblioteca Viva", v:1, cifrado:"AES-GCM", iv:aB64(iv), datos:aB64(ct), guardado:new Date().toISOString()};
}
async function descifrarDatos(f){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(f.iv)}, claveDatos, b64(f.datos));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function api(ruta, opciones={}){
  const res = await fetch("https://api.github.com"+ruta, {...opciones, cache:"no-store",
    headers:{"Accept":"application/vnd.github+json", "Authorization":"Bearer "+gh.token, "X-GitHub-Api-Version":"2022-11-28", ...(opciones.headers||{})}});
  if(res.status===404) return null;
  if(!res.ok){ const err = new Error((await res.json().catch(()=>({}))).message || res.statusText); err.status = res.status; throw err; }
  return res.json();
}
const repoRuta = () => `/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}`;
async function asegurarRama(){
  if(ramaLista) return;
  if(!await api(`${repoRuta()}/branches/${encodeURIComponent(gh.rama)}`)){
    const repo = await api(repoRuta()); if(!repo) throw Object.assign(new Error("No encuentro el repositorio"), {status:404});
    const base = await api(`${repoRuta()}/git/ref/heads/${encodeURIComponent(repo.default_branch)}`);
    await api(`${repoRuta()}/git/refs`, {method:"POST", body:JSON.stringify({ref:"refs/heads/"+gh.rama, sha:base.object.sha})});
  }
  ramaLista = true;
}
async function leerRemoto(){
  const f = await leerArchivoRepo(GH_RUTA, gh.rama);
  return f ? {sha:f.sha, archivo:JSON.parse(f.texto)} : null;
}
const paquete = () => ({rondas:S.rondas, registros:S.registros, borrados:S.borrados, fotosMeta:S.fotosMeta||{}});
const claveReg = r => r.alumnoId+"|"+r.ronda;
function fusionar(remoto){
  S.fotosMeta = {...(remoto.fotosMeta||{}), ...(S.fotosMeta||{})};
  (remoto.rondas||[]).forEach(r=>{ if(!S.rondas.some(x=>x.id===r.id)) S.rondas.push(r); });
  S.rondas.sort((a,b)=>a.limite.localeCompare(b.limite));
  const borr = new Map();
  [...S.borrados, ...(remoto.borrados||[])].forEach(b=>{ if(!borr.has(b.clave) || borr.get(b.clave) < b.fecha) borr.set(b.clave, b.fecha); });
  S.borrados = [...borr].map(([clave,fecha])=>({clave,fecha}));
  const mapa = new Map(S.registros.map(r=>[claveReg(r), r]));
  (remoto.registros||[]).forEach(n=>{ const l = mapa.get(claveReg(n)); if(!l || (n.actualizado||"") > (l.actualizado||"")) mapa.set(claveReg(n), n); });
  /* Se descarta solo lo anterior al borrado. Un paquete con «eliminar» seguido del registro nuevo los crea en el mismo
     milisegundo; con «<=» el registro nuevo se perdía al sincronizar. */
  S.registros = [...mapa.values()].filter(r=>!(borr.has(claveReg(r)) && (r.actualizado||"") < borr.get(claveReg(r))));
}
function pintarSync(){
  const el = $("#sync"); if(!el) return;
  if(!gh){ el.className = "sync"; el.textContent = "Guardado solo en este equipo"; return; }
  el.className = "sync " + (estadoSync.tipo==="ok" ? "ok" : estadoSync.tipo==="error" ? "err" : "");
  el.textContent = estadoSync.texto || "GitHub conectado";
}
function programarSync(){
  if(!gh || !claveDatos) return;
  clearTimeout(syncTimer); estadoSync = {tipo:"pendiente", texto:"Cambios por subir…"}; pintarSync();
  syncTimer = setTimeout(sincronizar, 2500);
}
async function sincronizar(){
  if(!gh || !claveDatos) return false;
  if(syncEnCurso){ syncPendiente = true; return false; }
  syncEnCurso = true; estadoSync = {tipo:"pendiente", texto:"Guardando en GitHub…"}; pintarSync();
  let ok = false;
  for(let intento=0; intento<3 && !ok; intento++){
    try{
      await asegurarRama();
      const remoto = await leerRemoto();
      const antes = JSON.stringify(paquete());
      let remotoTexto = null;
      if(remoto){
        const datos = await descifrarDatos(remoto.archivo);
        remotoTexto = JSON.stringify({rondas:datos.rondas, registros:datos.registros, borrados:datos.borrados, fotosMeta:datos.fotosMeta||{}});
        fusionar(datos);
      }
      const ahora = JSON.stringify(paquete());
      if(ahora !== antes){ autocompletarLibros(); guardarLocal(); if(vista!=="registrar") render(); }
      if(JSON.stringify(paquete()) !== remotoTexto){
        const archivo = await cifrarDatos(paquete());
        const sello = new Date().toLocaleString("es-MX", {dateStyle:"short", timeStyle:"short"});
        await escribirArchivoRepo(GH_RUTA, JSON.stringify(archivo), gh.rama, remoto?.sha, `Reportes de lectura · ${sello}`);
      }
      await subirFotosPendientes();
      ok = true;
      S.ultimaSync = new Date().toISOString(); guardarLocal();
      estadoSync = {tipo:"ok", texto:"Guardado en GitHub · "+new Date().toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"})};
    }catch(e){
      if((e.status===409 || e.status===422) && intento<2) continue;
      estadoSync = {tipo:"error", texto: e.name==="OperationError" ? "La contraseña de este equipo no abre los datos guardados en GitHub"
        : e.status===401 ? "GitHub rechazó el token (venció o está mal copiado)"
        : e.status===403 ? "El token no tiene permiso de escritura en el repositorio"
        : e.status===404 ? "No encuentro el repositorio: revise usuario y nombre"
        : navigator.onLine===false ? "Sin internet: se guardará al reconectar"
        : "No se pudo guardar en GitHub: "+e.message};
      break;
    }
  }
  syncEnCurso = false; pintarSync();
  if(vista==="datos") render();
  if(syncPendiente){ syncPendiente = false; programarSync(); }
  return ok;
}
function sugerenciaRepo(){
  const h = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  return {owner:h, repo: h ? (location.pathname.split("/").filter(Boolean)[0] || h+".github.io") : ""};
}

async function conectarGitHub(ev){
  ev.preventDefault();
  const pw = $("#ghPw").value;
  if(!(await verificarContrasena(pw))) return aviso("La contraseña de las listas no es correcta");
  gh = {owner:$("#ghOwner").value.trim(), repo:$("#ghRepo").value.trim(), rama:$("#ghRama").value.trim()||"datos", token:$("#ghToken").value.trim()};
  ramaLista = false;
  try{ localStorage.setItem(GH_KEY, JSON.stringify(gh)); }catch(e){}
  aviso("Conectando con GitHub…");
  try{ await resolverLlave(pw); pwSesion = pw; }
  catch(e){ estadoSync = {tipo:"error", texto: e.status===401 ? "GitHub rechazó el token (venció o está mal copiado)" : e.status===404 ? "No encuentro el repositorio: revise usuario y nombre" : "No se pudo preparar la llave de los datos: "+e.message}; pintarSync(); aviso(estadoSync.texto); return render(); }
  const ok = await sincronizar();

function desconectarGitHub(){
  if(!confirm("¿Quitar el token de este navegador? Lo guardado en GitHub se conserva.")) return;
  localStorage.removeItem(GH_KEY); gh = null; estadoSync = {tipo:"", texto:""}; pintarSync(); render();
}

/* ============================================================
   LLAVE DE DATOS Y CAMBIO DE CONTRASEÑA
   Los registros y las fotos se cifran con una llave de datos fija. Esa llave se guarda
   en GitHub envuelta (cifrada) con la contraseña, en datos/llave.cifrada.json.
   Cambiar la contraseña solo vuelve a envolver la llave y vuelve a cifrar las listas
   dentro de index.html: los datos y las fotos ya guardados no se tocan.
   ============================================================ */
const LLAVE_RUTA = "datos/llave.cifrada.json";
let pwSesion = "";
async function verificarContrasena(pw){
  try{ const k = await derivar(pw, ROSTER_CIFRADO.salt, false, ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ROSTER_CIFRADO.iv)}, k, b64(ROSTER_CIFRADO.ct)));
  }catch(e){ return null; }
}
async function fijarLlave(raw){
  claveDatos = await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["encrypt","decrypt"]);
  try{ localStorage.setItem(CLAVE_KEY, aB64(new Uint8Array(raw))); }catch(e){}
}
async function envolverLlave(pw){
  const sal = aB64(crypto.getRandomValues(new Uint8Array(16))), iv = crypto.getRandomValues(new Uint8Array(12));
  const kek = await derivar(pw, sal, false, ["encrypt"]);
  const raw = new Uint8Array(await crypto.subtle.exportKey("raw", claveDatos));
  return {aplicacion:"Reportes de Lectura · llave de datos", v:1, sal, iv:aB64(iv), llave:aB64(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, kek, raw)))};
}
async function desenvolverLlave(pw, f){
  const kek = await derivar(pw, f.sal, false, ["decrypt"]);
  return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(f.iv)}, kek, b64(f.llave));
}
/* Con la contraseña en mano: usa la llave guardada en GitHub; si aún no existe, la crea con la llave actual. */
async function resolverLlave(pw){
  await asegurarRama();
  const f = await leerArchivoRepo(LLAVE_RUTA, gh.rama);
  if(f){ await fijarLlave(await desenvolverLlave(pw, JSON.parse(f.texto))); return; }
  if(!claveDatos) await guardarClaveDatos(pw);
  await escribirArchivoRepo(LLAVE_RUTA, JSON.stringify(await envolverLlave(pw)), gh.rama, null, "Llave de datos");
}
async function leerArchivoRepo(ruta, rama){
  const url = `${repoRuta()}/contents/${ruta}?ref=${encodeURIComponent(rama)}`;
  const meta = await api(url); if(!meta) return null;
  let texto = meta.content ? new TextDecoder().decode(b64(meta.content.replace(/\n/g,""))) : "";
  if(!texto){
    const raw = await fetch("https://api.github.com"+url, {cache:"no-store", headers:{"Accept":"application/vnd.github.raw+json", "Authorization":"Bearer "+gh.token}});
    if(!raw.ok) throw Object.assign(new Error(raw.statusText), {status:raw.status});
    texto = await raw.text();
  }
  return {sha:meta.sha, texto};
}
const escribirArchivoRepo = (ruta, texto, rama, sha, mensaje) => api(`${repoRuta()}/contents/${ruta}`, {method:"PUT",
  body:JSON.stringify({message:mensaje, content:aB64(new TextEncoder().encode(texto)), branch:rama, ...(sha ? {sha} : {})})});

function tarjetaContrasena(){
  const listo = gh && claveDatos;
  return `<section class="card"><h2>Contraseña de las listas</h2>
  <p>Puede cambiarla aquí, con la sesión abierta. La aplicación vuelve a cifrar las listas dentro de la página publicada y actualiza la llave de los datos en GitHub. Los registros y las fotos ya guardados siguen funcionando.</p>
  ${listo ? `<form class="row" onsubmit="cambiarContrasena(event)" autocomplete="off">
    <label>Contraseña actual<input id="pwAct" type="password" required autocomplete="current-password"></label>
    <label>Contraseña nueva<input id="pwNva" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>Repetir la nueva<input id="pwNva2" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">Cambiar contraseña</button></form>
  <p id="pwEstado" class="muted" role="status" style="min-height:1.3em"></p>
  <div class="note">Después del cambio, GitHub tarda uno o dos minutos en publicar la página nueva. Los equipos donde ya está abierta la sesión siguen funcionando igual. En un equipo nuevo, o si alguien borra los datos del navegador, se escribe la contraseña nueva. Use al menos 8 caracteres y compártala solo con quien capture.</div>`
  : `<div class="warn">Para cambiar la contraseña hace falta tener activo el guardado en GitHub, porque las listas cifradas viven dentro de la página publicada. Actívelo en «Exportar y respaldos» y vuelva aquí.</div><button class="btn sec" onclick="ir('datos')">Ir a Exportar y respaldos</button>`}
  </section>`;
}
async function cambiarContrasena(ev){
  ev.preventDefault();
  const act = $("#pwAct").value, nva = $("#pwNva").value, nva2 = $("#pwNva2").value, est = $("#pwEstado");
  const decir = t => { if(est) est.textContent = t; };
  if(nva !== nva2) return decir("La contraseña nueva no coincide en los dos campos.");
  if(nva.length < 8) return decir("La contraseña nueva necesita al menos 8 caracteres.");
  if(nva === act) return decir("La contraseña nueva es igual a la actual.");
  decir("Comprobando la contraseña actual…");
  const plano = await verificarContrasena(act);
  if(!plano) return decir("La contraseña actual no es correcta.");
  try{
    decir("Leyendo la página publicada en GitHub…");
    const repo = await api(repoRuta()); if(!repo) throw Object.assign(new Error("No encuentro el repositorio"), {status:404});
    const pagina = await leerArchivoRepo("index.html", repo.default_branch);
    const patron = /^(?:const|let) ROSTER_CIFRADO = \{[^\n]*\};$/m;
    if(!pagina || !patron.test(pagina.texto)) throw new Error("index.html del repositorio no tiene el bloque de listas esperado. Suba primero la versión vigente de la aplicación.");
    decir("Cifrando las listas con la contraseña nueva…");
    const salt = aB64(crypto.getRandomValues(new Uint8Array(16))), iv = crypto.getRandomValues(new Uint8Array(12));
    const k = await derivar(nva, salt, false, ["encrypt"]);
    const nuevo = {v:2, iter:ROSTER_CIFRADO.iter, salt, iv:aB64(iv), ct:aB64(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, plano)))};
    const linea = `let ROSTER_CIFRADO = {v:2, iter:${nuevo.iter}, salt:"${nuevo.salt}", iv:"${nuevo.iv}", ct:"${nuevo.ct}"};`;
    decir("Guardando la página con la contraseña nueva…");
    await escribirArchivoRepo("index.html", pagina.texto.replace(patron, ()=>linea), repo.default_branch, pagina.sha, "Cambio de contraseña de las listas");
    ROSTER_CIFRADO = nuevo; pwSesion = nva;
    decir("Actualizando la llave de los datos…");
    await asegurarRama();
    let hecho = false, ultimoError = null;
    for(let i=0; i<3 && !hecho; i++){
      try{ const f = await leerArchivoRepo(LLAVE_RUTA, gh.rama);
        await escribirArchivoRepo(LLAVE_RUTA, JSON.stringify(await envolverLlave(nva)), gh.rama, f?.sha, "Llave de datos con la contraseña nueva"); hecho = true;
      }catch(e){ ultimoError = e; }
    }
    if(!hecho) throw new Error("La página ya tiene la contraseña nueva, pero no se pudo actualizar la llave de los datos ("+(ultimoError?.message||"")+"). Vuelva a pulsar «Cambiar contraseña» escribiendo la NUEVA como actual.");
    ev.target.reset();
    decir("Listo. La contraseña cambió. En uno o dos minutos la página publicada pedirá la nueva.");
    aviso("Contraseña cambiada");
  }catch(e){
    decir(e.status===403 ? "El token no tiene permiso para modificar index.html (Contents: Read and write)." : e.status===401 ? "GitHub rechazó el token." : "No se pudo cambiar: "+e.message);
  }
}

/* ============================================================
   EVIDENCIAS FOTOGRÁFICAS
   Cada reporte puede tener fotos. Cada apartado y cada dimensión puede llevar un
   «ancla»: la foto, la zona marcada (en fracciones del ancho y alto), lo que se lee
   ahí y por qué se valoró así. Las fotos se guardan comprimidas en este navegador
   (IndexedDB) y, con GitHub activo, cifradas en datos/evidencias/.
   ============================================================ */
const IDB_NOMBRE = "reportes_lectura_evidencias";
function idb(){
  if(!idb.p) idb.p = new Promise((ok, mal)=>{ const r = indexedDB.open(IDB_NOMBRE, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("fotos", {keyPath:"id"}); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
  return idb.p;
}
async function idbOp(modo, fn){
  const db = await idb();
  return new Promise((ok, mal)=>{ const tx = db.transaction("fotos", modo); const req = fn(tx.objectStore("fotos")); tx.oncomplete = () => ok(req?.result); tx.onerror = () => mal(tx.error); });
}
const fotoGet = id => idbOp("readonly", st=>st.get(id));
const fotoPut = f => idbOp("readwrite", st=>st.put(f));
const fotoTodas = () => idbOp("readonly", st=>st.getAll());
const rutaFoto = id => `datos/evidencias/${id}.cifrado.json`;
const urlsFoto = new Map();
async function blobFoto(id){
  const f = await fotoGet(id).catch(()=>null);
  if(f?.blob) return f.blob;
  if(!(gh && claveDatos)) return null;
  try{
    const a = await leerArchivoRepo(rutaFoto(id), gh.rama); if(!a) return null;
    const c = JSON.parse(a.texto);
    const bytes = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(c.iv)}, claveDatos, b64(c.datos));
    const blob = new Blob([bytes], {type:"image/jpeg"});
    await fotoPut({id, blob, pendiente:false}); return blob;
  }catch(e){ return null; }
}
async function urlFoto(id){
  if(urlsFoto.has(id)) return urlsFoto.get(id);
  const b = await blobFoto(id); if(!b) return null;
  const u = URL.createObjectURL(b); urlsFoto.set(id, u); return u;
}
/* Pone la imagen en cada <img data-foto> que haya en pantalla. */
function hidratarFotos(raiz=document){
  raiz.querySelectorAll("img[data-foto]:not([src])").forEach(async img=>{
    const u = await urlFoto(img.dataset.foto);
    if(u) img.src = u; else img.replaceWith(Object.assign(document.createElement("span"), {className:"muted", textContent:"Foto no disponible en este equipo"}));
  });
}
async function subirFotosPendientes(){
  if(!(gh && claveDatos)) return;
  const pend = (await fotoTodas().catch(()=>[])).filter(f=>f.pendiente && f.blob);
  for(const f of pend){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, claveDatos, await f.blob.arrayBuffer()));
    const texto = JSON.stringify({aplicacion:"Reportes de Lectura · evidencia", v:1, iv:aB64(iv), datos:aB64(ct)});
    try{ await escribirArchivoRepo(rutaFoto(f.id), texto, gh.rama, null, "Evidencia de reporte"); }
    catch(e){ if(e.status!==422) throw e; }   /* 422: ya existía en GitHub */
    await fotoPut({...f, pendiente:false});
  }
}
async function comprimirFoto(file){
  const bmp = await createImageBitmap(file, {imageOrientation:"from-image"}).catch(()=>null);
  if(!bmp) throw new Error(`No pude abrir «${file.name}». Use fotos JPG o PNG (las HEIC del iPhone conviene exportarlas como JPG).`);
  const k = Math.min(1, 1600/Math.max(bmp.width, bmp.height));
  const cv = Object.assign(document.createElement("canvas"), {width:Math.round(bmp.width*k), height:Math.round(bmp.height*k)});
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(ok=>cv.toBlob(ok, "image/jpeg", 0.8));
  return {blob, w:cv.width, h:cv.height};
}
/* Comprime la foto y la guarda en este equipo. «pendiente» = se sube a GitHub en la siguiente sincronización. */
async function guardarFoto(file, pendiente){
  const {blob, w, h} = await comprimirFoto(file); const id = "ev-" + uid();
  await fotoPut({id, blob, pendiente});
  return {id, nombre:file.name || `Foto ${fechaHora()}`, w, h};
}
async function agregarFotos(alumnoId, rondaId, archivos){
  const r = obtenerRegistro(alumnoId, rondaId); r.evidencias = r.evidencias || []; S.fotosMeta = S.fotosMeta || {};
  let n = 0;
  for(const file of archivos){
    try{ const f = await guardarFoto(file, true);
      S.fotosMeta[f.id] = {nombre:f.nombre, w:f.w, h:f.h}; r.evidencias.push(f.id); n++;
    }catch(e){ aviso(e.message); }
  }
  if(!r.fotos) r.fotos = archivos.length ? [...archivos].map(f=>f.name).join(", ") : "";
  tocar(r); render(); if(n) aviso(`${n} foto(s) agregada(s)`);
}
function quitarFoto(alumnoId, rondaId, id){
  if(!confirm("¿Quitar esta foto del reporte? Las zonas marcadas en ella también se quitan.")) return;
  const r = registroDe(alumnoId, rondaId); if(!r) return;
  r.evidencias = (r.evidencias||[]).filter(x=>x!==id);
  Object.keys(r.anclas||{}).forEach(k=>{ if(r.anclas[k].foto===id) r.anclas[k] = {...r.anclas[k], foto:"", x:undefined, y:undefined, w:undefined, h:undefined}; });
  tocar(r); render();
}
const nombreFoto = id => S.fotosMeta?.[id]?.nombre || id;
/* Claves de ancla de un reporte: s0..sN (apartados) y dD1..dD5 (dimensiones que aplican). */
function clavesAncla(alumnoId, rondaId){
  const grado = gradoDe(alumnoPorId(alumnoId).grupo);
  return [...seccionesDe(alumnoId, rondaId).map((_,i)=>"s"+i), ...DIMENSIONES.filter(d=>dimAplica(d, grado)).map(d=>"d"+d.id)];
}
function etiquetaAncla(alumnoId, rondaId, k){
  if(k[0]==="s"){ const i = +k.slice(1); const s = seccionesDe(alumnoId, rondaId)[i]; return i===0 ? s.titulo : `${i}. ${s.titulo}`; }
  const d = DIMENSIONES.find(x=>"d"+x.id===k); return d ? `${d.id} · ${d.nombre}` : k;
}
const codigoAncla = k => k[0]==="s" ? (k==="s0" ? "E" : k.slice(1)) : k.slice(1);
/* Dónde está en la hoja, descrito con palabras; si no se escribió, se deduce de la posición del recuadro. */
function posicionTexto(a){
  if(!a?.w) return "";
  const cx = a.x + a.w/2, cy = a.y + a.h/2;
  const v = cy < .34 ? "superior" : cy < .67 ? "central" : "inferior", hz = cx < .34 ? " izquierda" : cx < .67 ? "" : " derecha";
  return `En la parte ${v}${hz} de la fotografía`;
}
function descripcionAncla(a){
  if(!a) return "";
  const donde = a.donde || posicionTexto(a);
  return [donde, a.lee].filter(Boolean).join(": ");
}
/* Botón y línea de evidencia bajo cada apartado o dimensión en «Revisar». */

    ${a?.razon || a?.lee ? `<small class="ind evidtxt">${descripcionAncla(a) ? `<i>${esc(descripcionAncla(a))}</i> · ` : ""}${esc(a.razon||"")}</small>` : ""}`;
}
function tarjetaEvidencias(alumnoId, rondaId, r){

    <label class="btnfoto">🖼️ Elegir fotografías<input type="file" accept="image/*" multiple class="hidden" onchange="agregarFotos('${alumnoId}','${rondaId}',[...this.files]);this.value=''"></label></div></div>
    <p class="muted" style="font-size:.84rem;margin:6px 0">Toque una foto para verla con las zonas marcadas. En cada apartado y dimensión, «📷 Evidencia» muestra dónde está en la foto lo que se valoró, qué se lee ahí y por qué se registró así; ahí mismo puede marcar o corregir la zona.</p>

        <figcaption>${esc(nombreFoto(id))}<br><span class="muted">${n} zona(s)</span> · <a href="#" onclick="quitarFoto('${alumnoId}','${rondaId}','${id}');return false">quitar</a></figcaption></figure>`; }).join("")}</div>`

/* ---------- recibir fotos (bandeja) ----------
   Las fotos llegan a una bandeja de este equipo (celular o computadora). Cada una se asigna a un alumno

const TIPOS_FOTO = {reporte:"Página del reporte", libro:"Portada del libro devuelto", ambos:"Reporte y libro en la misma foto"};
let soltarListo = false;
async function recibirFotos(archivos){
  archivos = [...archivos].filter(f=>f.type.startsWith("image/") || /\.(jpe?g|png|webp|heic)$/i.test(f.name||""));

    try{ const f = await guardarFoto(file, false);
      S.bandeja.push({...f, llegada:hoy(), grupo:filtroGrupo, alumnoId:"", tipo:"reporte", fecha:hoy(), marcarFecha:true}); n++;
    }catch(e){ aviso(e.message); }
  }
  guardarLocal(); render(); if(n) aviso(`${n} foto(s) en la bandeja`);
}
function editarBandeja(id, k, v){
  const b = (S.bandeja||[]).find(x=>x.id===id); if(!b) return;
  b[k] = v; if(k==="grupo") b.alumnoId = "";
  guardarLocal(); if(k==="grupo" || k==="alumnoId" || k==="tipo") render();
}
async function asignarFoto(id){
  const b = (S.bandeja||[]).find(x=>x.id===id); if(!b) return;
  if(!b.alumnoId) return aviso("Elija primero al alumno");
  const ronda = rondaSel(); const a = alumnoPorId(b.alumnoId);
  const r = obtenerRegistro(b.alumnoId, ronda.id); r.evidencias = r.evidencias || []; S.fotosMeta = S.fotosMeta || {};
  if(!r.evidencias.includes(id)) r.evidencias.push(id);
  S.fotosMeta[id] = {nombre:b.nombre, w:b.w, h:b.h};
  const notas = [];
  if(b.marcarFecha && b.fecha){
    if(b.tipo!=="libro"){ if(r.fechaRecepcion) notas.push(`el reporte ya tenía fecha (${fmtFecha(r.fechaRecepcion)})`); else r.fechaRecepcion = b.fecha; }
    if(b.tipo!=="reporte"){ if(r.libroDevuelto) notas.push(`el libro ya tenía fecha (${fmtFecha(r.libroDevuelto)})`); else r.libroDevuelto = b.fecha; }
  }
  const f = await fotoGet(id).catch(()=>null); if(f) await fotoPut({...f, pendiente:true});
  S.bandeja = S.bandeja.filter(x=>x.id!==id);
  tocar(r); render();
  aviso(`${a.grupo} n.º ${a.nl}: ${TIPOS_FOTO[b.tipo].toLowerCase()} agregada${notas.length ? " · se respetó la fecha: "+notas.join(" y ") : ""}`);
}
async function descartarFoto(id){
  if(!confirm("¿Quitar esta foto de la bandeja? No se guarda en ningún reporte.")) return;
  S.bandeja = (S.bandeja||[]).filter(x=>x.id!==id);
  await idbOp("readwrite", st=>st.delete(id)).catch(()=>{});
  const u = urlsFoto.get(id); if(u){ URL.revokeObjectURL(u); urlsFoto.delete(id); }
  guardarLocal(); render();
}
/* ---------- propuesta de Claude (proyecto externo) ----------
   Claude ve las fotos, pero no conoce sus id en la app: cada foto se cita por una referencia («foto 1»,
   o el nombre del archivo). Aquí se vincula cada referencia con una foto de la bandeja; luego la propuesta
   se aplica como un paquete de evidencias normal. Las fechas solo se registran si el alumno no las tiene. */
const CAMPOS_PROPUESTA = ["numReporte","produccion","formato","estilo","secciones","dimensiones","personalizacion","siguiente","observacion","notaDocente","libro","anclas"];
function recibirPropuesta(d){
  if(d.ronda && !rondaPorId(d.ronda)) return aviso(`La propuesta es de la ronda «${d.ronda}», que no existe en la app`);
  const band = S.bandeja || []; const norm = t => String(t||"").trim().toLowerCase();
  d.registros.forEach(r=>{ r.vinculo = {}; (r.fotos||[]).forEach(f=>{ const b = band.find(x=>norm(x.nombre)===norm(f.ref)); r.vinculo[f.ref] = b ? b.id : ""; }); });
  S.propuesta = {...d, fecha:hoy()}; guardarLocal();
  if(d.ronda) rondaActiva = d.ronda;
  ir("fotos"); aviso(`Propuesta con ${d.registros.length} alumno(s): vincule cada foto y pulse «Aplicar propuesta»`);
}
function vincularFoto(i, j, id){ const r = S.propuesta.registros[i]; r.vinculo[r.fotos[j].ref] = id; guardarLocal(); render(); }
function marcarPropuesta(i, k, v){ S.propuesta.registros[i][k] = v; guardarLocal(); }
function tarjetaPropuesta(){
  const P = S.propuesta; if(!P) return "";
  const band = S.bandeja || []; const usados = new Set(P.registros.flatMap(r=>Object.values(r.vinculo||{})).filter(Boolean));
  const opc = (sel) => `<option value="">— elegir foto de la bandeja —</option>${band.map((b,k)=>`<option value="${b.id}" ${b.id===sel?"selected":""}>B${k+1} · ${esc(b.nombre)}${usados.has(b.id)&&b.id!==sel?" (ya vinculada)":""}</option>`).join("")}`;
  return `<section class="card" style="border-color:var(--brand)"><h2>Propuesta de Claude por aplicar · ${esc(rondaPorId(P.ronda)?.nombre||P.ronda||"")}</h2>
  <p class="muted">Para cada alumno, elija qué foto de la bandeja (B1, B2…) corresponde a cada foto que citó Claude. Si una foto todavía no está en la bandeja, súbala arriba. Revise la valoración en «Revisar reporte» después de aplicarla.</p>
  ${P.registros.map((r,i)=>{ const a = alumnoPorId(r.alumnoId);
    return `<div class="dim"><b>${a ? `${a.grupo} ${a.nl}. ${esc(a.nombre)}` : `⚠️ ${esc(r.alumnoId)} no está en la lista`}</b>${r.observacion?`<small class="ind">${esc(r.observacion.slice(0,180))}${r.observacion.length>180?"…":""}</small>`:""}
      ${(r.fotos||[]).map((f,j)=>`<label style="margin-top:6px">${esc(f.ref)} · ${esc(f.muestra||"")}${f.describe?` · <span class="muted">${esc(f.describe)}</span>`:""}<select onchange="vincularFoto(${i},${j},this.value)">${opc(r.vinculo?.[f.ref])}</select></label>`).join("")}
      <div class="row" style="gap:12px;margin-top:6px">
        <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" ${r.entregaReporte?"checked":""} onchange="marcarPropuesta(${i},'entregaReporte',this.checked)"> Reporte recibido</label>
        <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" ${r.libroDevuelto?"checked":""} onchange="marcarPropuesta(${i},'libroDevuelto',this.checked)"> Libro devuelto</label>
      </div></div>`; }).join("")}
  ${(P.sinIdentificar||[]).length ? `<div class="warn">Claude no pudo identificar: ${P.sinIdentificar.map(x=>`${esc(x.ref)} (${esc(x.describe||"")})`).join(" · ")}. Asígnelas a mano en la bandeja.</div>` : ""}
  <div class="row" style="gap:8px;margin-top:8px"><label>Fecha de entrega<input type="date" value="${P.fecha||hoy()}" onchange="S.propuesta.fecha=this.value;guardarLocal()"></label>
    <button class="btn" onclick="aplicarPropuesta()">Aplicar propuesta</button><button class="btn sec danger" onclick="if(confirm('¿Descartar la propuesta? Las fotos siguen en la bandeja.')){S.propuesta=null;guardarLocal();render();}">Descartar</button></div>
  <p class="muted" style="font-size:.84rem">La fecha solo se registra en quien no la tenga. Las fotos vinculadas salen de la bandeja y pasan a las evidencias de cada reporte.</p></section>`;
}
async function aplicarPropuesta(){
  const P = S.propuesta; if(!P) return; const ronda = rondaPorId(P.ronda) || rondaSel();
  const falta = P.registros.flatMap(r=>(r.fotos||[]).filter(f=>!r.vinculo?.[f.ref]).map(f=>`${r.alumnoId}: ${f.ref}`));
  if(falta.length && !confirm(`Faltan por vincular:\n${falta.join("\n")}\n\nLas zonas de esas fotos quedarán sin recuadro. ¿Aplicar de todos modos?`)) return;
  const regs = []; const movidas = new Set(); S.fotosMeta = S.fotosMeta || {};
  for(const r of P.registros){
    if(!alumnoPorId(r.alumnoId)) continue;
    const n = {alumnoId:r.alumnoId, ronda:ronda.id};
    CAMPOS_PROPUESTA.forEach(k=>{ if(r[k]!==undefined) n[k] = structuredClone(r[k]); });
    const ids = (r.fotos||[]).map(f=>r.vinculo?.[f.ref]).filter(Boolean);
    if(ids.length) n.evidencias = [...new Set(ids)];
    Object.values(n.anclas||{}).forEach(z=>{ if(!z) return; const id = r.vinculo?.[z.foto]; if(id) z.foto = id; else if(z.foto){ z.foto = ""; z.x = z.y = z.w = z.h = null; } });
    const prev = registroDe(r.alumnoId, ronda.id);
    if(r.entregaReporte && P.fecha && !prev?.fechaRecepcion) n.fechaRecepcion = P.fecha;
    if(r.libroDevuelto && P.fecha && !prev?.libroDevuelto) n.libroDevuelto = P.fecha;
    ids.forEach(id=>movidas.add(id));
    regs.push(n);
  }
  for(const id of movidas){
    const b = (S.bandeja||[]).find(x=>x.id===id); if(b) S.fotosMeta[id] = {nombre:b.nombre, w:b.w, h:b.h};
    const f = await fotoGet(id).catch(()=>null); if(f) await fotoPut({...f, pendiente:true});
  }
  S.bandeja = (S.bandeja||[]).filter(x=>!movidas.has(x.id)); S.propuesta = null;
  rondaActiva = ronda.id;
  await importarEvidencias({tipo:"evidencias_reporte_lectura", fotos:[], registros:regs});
}
/* Contexto compacto de la ronda para el proyecto de Claude: quién tiene qué libro y qué apartados se revisan. */
function exportarContexto(){
  const ronda = rondaSel();
  const filas = S.roster.slice().sort((a,b)=>GRUPOS.indexOf(a.grupo)-GRUPOS.indexOf(b.grupo)||a.nl-b.nl).map(a=>{
    const f = folioDe(a.id, ronda.id); const L = LIBROS[f]||{}; const g = perfilDe(a.id)?.guia;
    const guia = g && g.ronda===ronda.id && g.apartados?.length;
    const lista = seccionesDe(a.id, ronda.id).map((s,i)=>`s${i} ${s.titulo}`).join(" | ");
    return [a.id, a.grupo, a.nl, a.nombre, f, L.t||"", L.a||"", rondaSinReporte(a.id, ronda.id) ? "sigue con el libro anterior" : "", guia ? lista : `formato de ${gradoDe(a.grupo)}.°`]; });
  /* Los apartados del formato de grado se escriben una sola vez al final, para que el archivo pese poco. */
  const tabla = (ronda.id==="R1" ? SECCIONES_R1 : SECCIONES);
  const formatos = Object.entries(tabla).map(([g,t])=>[`formato de ${g}.°`, t.map((x,i)=>`s${i} ${x}`).join(" | ")]);
  descargar(`contexto_${ronda.id}_${hoy()}.csv`, csv([["alumnoId","grupo","nl","nombre","codigo","titulo","autor","nota","apartados"], ...filas, [], ["formato","apartados"], ...formatos]), "text/csv;charset=utf-8");
}

/* ---------- visor ---------- */
let V = null;
function abrirVisor(alumnoId, rondaId, clave, foto){
  const r = registroDe(alumnoId, rondaId) || {};
  const claves = clavesAncla(alumnoId, rondaId);
  if(!clave) clave = Object.keys(r.anclas||{}).find(k=>r.anclas[k].foto===foto) || claves[1] || claves[0];
  const a = r.anclas?.[clave] || {};
  V = {alumnoId, rondaId, clave, foto: foto || a.foto || (r.evidencias||[])[0] || "", zona: a.foto && a.w ? {x:a.x, y:a.y, w:a.w, h:a.h} : null, dibujando:false};
  if(foto && a.foto !== foto) V.zona = null;
  let dlg = $("#visor");
  if(!dlg){ dlg = document.createElement("dialog"); dlg.id = "visor"; document.body.appendChild(dlg); dlg.addEventListener("close", ()=>{ V = null; render(); }); }
  pintarVisor(); if(!dlg.open) dlg.showModal();
}
function pintarVisor(){
  const dlg = $("#visor"); if(!V || !dlg) return;

  const valor = clave[0]==="s" ? (VALORACION[r.secciones?.[+clave.slice(1)]] ?? "Sin marcar") : (r.dimensiones?.[clave.slice(1)] ? `${r.dimensiones[clave.slice(1)]} · ${NIVELES[r.dimensiones[clave.slice(1)]-1]}` : "Sin evidencia");
  /* Zonas de otros apartados en esta foto; las que coinciden se agrupan en una sola etiqueta (p. ej. «5 · D4»). */
  const actualK = V.zona ? [V.zona.x,V.zona.y,V.zona.w,V.zona.h].join() : "";
  const grupos = new Map();
  Object.entries(r.anclas||{}).filter(([k,x])=>k!==clave && x.foto===V.foto && x.w).forEach(([k,x])=>{
    const g = [x.x,x.y,x.w,x.h].join(); if(g===actualK) return;
    if(!grupos.has(g)) grupos.set(g, {x, claves:[]}); grupos.get(g).claves.push(k); });
  const otras = [...grupos.values()];
  dlg.innerHTML = `<div class="visor">
    <div class="vhead"><div><b>${esc(alumnoPorId(alumnoId).nombre)}</b> · ${esc(rondaPorId(rondaId).nombre)}<br><span class="vtitulo">${esc(etiquetaAncla(alumnoId, rondaId, clave))}</span> <span class="chip" style="background:var(--brand-soft)">${esc(valor)}</span></div>
      <div class="row" style="gap:4px"><button class="btn small sec" ${i<=0?"disabled":""} onclick="moverVisor(-1)">◀ Anterior</button><button class="btn small sec" ${i>=claves.length-1?"disabled":""} onclick="moverVisor(1)">Siguiente ▶</button><button class="btn small" onclick="$('#visor').close()">Cerrar</button></div></div>
    <div class="vcuerpo">
      <div class="vfoto${V.dibujando?" dibujando":""}" id="vfoto">${V.foto ? `<img data-foto="${esc(V.foto)}" alt="${esc(nombreFoto(V.foto))}" draggable="false">
        ${otras.map(g=>`<button type="button" class="zona otra" style="${estiloZona(g.x)}" onclick="cambiarClaveVisor('${g.claves[0]}')" title="${esc(g.claves.map(k=>etiquetaAncla(alumnoId, rondaId, k)).join(" · "))}"><span>${g.claves.map(codigoAncla).join(" · ")}</span></button>`).join("")}
        ${V.zona ? `<div class="zona actual" style="${estiloZona(V.zona)}"><span>${[clave, ...Object.entries(r.anclas||{}).filter(([k,x])=>k!==clave && x.foto===V.foto && x.w && [x.x,x.y,x.w,x.h].join()===actualK).map(([k])=>k)].map(codigoAncla).join(" · ")}</span></div>` : ""}` : `<p class="muted" style="padding:20px">Este reporte aún no tiene fotos. Agréguelas en «Evidencias del reporte».</p>`}</div>
      <div class="vpanel">
        ${evs.length ? `<label>Foto<select onchange="V.foto=this.value;V.zona=null;pintarVisor()">${evs.map(id=>`<option value="${esc(id)}" ${id===V.foto?"selected":""}>${esc(nombreFoto(id))}</option>`).join("")}</select></label>` : ""}
        <div class="row" style="gap:6px;margin:8px 0">
          <button class="btn small${V.dibujando?"":" sec"}" ${V.foto?"":"disabled"} onclick="V.dibujando=!V.dibujando;pintarVisor()">${V.dibujando ? "Arrastre sobre la foto…" : "✏️ Marcar zona"}</button>
          <button class="btn small sec" ${V.zona?"":"disabled"} onclick="V.zona=null;pintarVisor()">Quitar zona</button></div>
        <label>Dónde está en la hoja y quién lo escribió<textarea id="vDonde" rows="2" placeholder="Ej.: En el encabezado, escrito por un adulto con pluma azul">${esc(a.donde||"")}</textarea></label>
        <label style="margin-top:6px">Lo que se lee o se ve ahí<textarea id="vLee" rows="3">${esc(a.lee||"")}</textarea></label>
        <label style="margin-top:6px">Lo que se observa (sale en el PDF y el Word; en lenguaje claro para las familias)<textarea id="vRazon" rows="4">${esc(a.razon||"")}</textarea></label>
        <div class="row" style="margin-top:8px"><button class="btn" onclick="guardarAncla()">Guardar</button><button class="btn sec" onclick="guardarAncla(true)">Guardar y seguir ▶</button></div>
        <p class="muted" style="font-size:.8rem">Las zonas con número son de otros apartados (E = encabezado, D1–D5 = dimensiones). Tóquelas para ir a ese apartado.</p>
      </div></div></div>`;
  hidratarFotos(dlg);
  const caja = $("#vfoto", dlg);
  if(caja && V.dibujando){
    let inicio = null; const div = document.createElement("div"); div.className = "zona actual";
    const pos = e => { const b = caja.querySelector("img").getBoundingClientRect(); return {x:Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)), y:Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))}; };
    caja.onpointerdown = e => { if(!caja.querySelector("img")?.complete) return; e.preventDefault(); caja.setPointerCapture(e.pointerId); inicio = pos(e); caja.appendChild(div); };
    caja.onpointermove = e => { if(!inicio) return; const p = pos(e); V.zona = {x:Math.min(inicio.x,p.x), y:Math.min(inicio.y,p.y), w:Math.abs(p.x-inicio.x), h:Math.abs(p.y-inicio.y)}; div.setAttribute("style", estiloZona(V.zona)); };
    caja.onpointerup = () => { if(!inicio) return; inicio = null; if(V.zona && (V.zona.w < .01 || V.zona.h < .01)) V.zona = null; V.dibujando = false; const don = $("#vDonde").value, lee = $("#vLee").value, raz = $("#vRazon").value; pintarVisor(); $("#vDonde").value = don; $("#vLee").value = lee; $("#vRazon").value = raz; };
